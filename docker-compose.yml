services:
  kuzma:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
    depends_on:
      - parakeet
    restart: unless-stopped

  parakeet:
    image: ghcr.io/groxaxo/parakeet-tdt-0.6b-v3-fastapi-openai:cpu
    ports:
      - "5092:5092"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3G
